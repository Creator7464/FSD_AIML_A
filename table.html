<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border = "1px" cellspacing = "5" cellpadding = "4" id = "products">
        <thead>
            <tr>
                <th>Product name</th>
                <th>Category</th>
                <th>Stocks</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script> 
        async function add_data_to_table(){
            try{
                const res = await fetch("https://dummyjson.com/product");
                const data = await res.json();
                const products = data.products;
                const el = document.querySelector("#products > tbody");
                products.forEach(item => {
                        el.innerHTML += `<tr>
                        <td>${item.title}</td> 
                        <td>${item.category}</td> 
                        <td>${item.stock}</td>
                        <td>${item.price}</td>
                        </tr>`
                    });
                }
            catch(err)
            {
                console.log("error = ", err);
            }
        }
    
        add_data_to_table();
    </script>
</body>
</html>
