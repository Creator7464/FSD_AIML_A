<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #products
        {
            border: 2px solid red;
            margin: auto;
            width: 80%;
            padding: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
    <table id = "products">
        <thead>
            <tr>
                <th>Product name</th>
                <th>Category</th>
                <th>Stocks</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
  
</body>
<script> 
        async function add_data_to_table(){
            const el = document.querySelector("#products>tbody");
            try{
                const res = await fetch("https://dummyjson.com/product/?limit=100");
                const data = await res.json();
                const products = data.products;
                console.log(products);
                
                products.forEach(item => {
                        el.innerHTML += `<tr>
                        <td>${item.title}</td> 
                        <td>${item.category}</td> 
                        <td>${item.stock}</td>
                        <td>₹${item.price}</td>
                        </tr>`
                    });
                }
            catch(err)
            {
                console.log("error = ", err);
                el.innerText = "Network error";
            }
        }
    
        add_data_to_table();
    </script>
</html>
